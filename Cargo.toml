[workspace]
resolver = "2"
members = ["crates/paperless-kv", "crates/paperless-intake", "crates/paperless-token"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/AdaWorldAPI/paperless-rs"

# ---------------------------------------------------------------------------
# Sibling wiring — git + [patch], NOT path deps
# ---------------------------------------------------------------------------
#
# P0 (lance-graph CLAUDE.md): always depend on the AdaWorldAPI fork, never the
# registry version. This repo takes the **git** form rather than the sibling
# `path` form the tesseract-rs crates use internally, so `paperless-rs` builds
# standalone from a bare clone — no pre-placed sibling checkouts, and the
# Dockerfile needs no clone step for them.
#
# Rev pins are FIXED and deliberate (resolved 2026-08-13). Branch refs are
# forbidden: a floating ref makes a build unreproducible and silently changes
# what a measurement measured.
#
#   lance-graph  @ 51c54fa   (bumped 2026-08-23 from bfc4f6d: the token seam
#                            consumes `deepnsm-v2`, which lives in the SAME repo.
#                            Two revs of one git URL would give two copies of
#                            `lance-graph-contract` whose types do not unify, so
#                            the pin moves as ONE deliberate act, not per-crate.)
#   OGAR         @ 70296be   (contains the merged ingestion spine, PR #266)
#   tesseract-rs @ b369a97
#   ndarray      @ 52dc61e
#
# ⚠ THE TRAP THE [patch] SECTIONS EXIST FOR (woa-rs learned this first; its
# own Cargo.toml carries the same note). Crates *inside* those repos declare
# their siblings by escaping relative path:
#
#   tesseract-ogar        ogar-vocab           = { path = "../../../OGAR/..." }
#                         lance-graph-contract = { path = "../../../lance-graph/..." }
#                         deepnsm              = { path = "../../../lance-graph/..." }
#   tesseract-recognizer  ndarray              = { path = "../../../ndarray" }
#   tesseract-core        lance-graph-contract = { path = "../../../lance-graph/..." }
#   deepnsm (in LG)       ndarray              = { path = "../../../ndarray" }
#
# From a Cargo *git checkout* those relative paths point outside the checkout
# and resolve to nothing. Each `[patch."<git-url>"]` below redirects the
# escaping names to their own git source so the tree compiles under git
# resolution. Add a crate to a patch list the moment it starts escaping —
# the failure mode is a confusing "failed to load source", not a clear error.
#
# `ogar-vocab` and `lance-graph-contract` are themselves zero-dep (the latter
# by explicit design — see its Cargo.toml comment), so nothing further needs
# redirecting through them.

[workspace.dependencies]
tesseract-ogar = { git = "https://github.com/AdaWorldAPI/tesseract-rs", rev = "b369a9758d642d1b7f3a02b3aca2f53497f74531" }
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "70296bec67d1a5db99dd3fa92a532ba060eb0838" }
# The source-agnostic perceptual IR — the document layer's OWN identity and
# span addressing. The token seam consumes it rather than minting a parallel
# `source_id`/`span_id`. Default features only: `classview` is OFF, so this
# edge stays serde-only and pulls no canon dependency.
ogar-doc-ir = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "70296bec67d1a5db99dd3fa92a532ba060eb0838" }
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", rev = "51c54faef235454401c6a7461ea05929c19f2140" }
# The semantic consumer of the token seam. Standalone crate (its own empty
# `[workspace]` table) inside the same checkout; only dep is the contract crate
# above, resolved by a path that stays INSIDE the checkout, so it needs no patch.
deepnsm-v2 = { git = "https://github.com/AdaWorldAPI/lance-graph", rev = "51c54faef235454401c6a7461ea05929c19f2140" }
# The lexical index. Fork per P0; default features off (in-RAM probe index, and
# the default set drags zstd-sys, a C build).
tantivy = { git = "https://github.com/AdaWorldAPI/tantivy", rev = "5fc9fccb613c9838cf7fde77f73dc4afa3216375", default-features = false }
sha2 = { version = "0.10", default-features = false }

[patch."https://github.com/AdaWorldAPI/tesseract-rs"]
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "70296bec67d1a5db99dd3fa92a532ba060eb0838" }
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", rev = "51c54faef235454401c6a7461ea05929c19f2140" }
deepnsm = { git = "https://github.com/AdaWorldAPI/lance-graph", rev = "51c54faef235454401c6a7461ea05929c19f2140" }
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", rev = "52dc61ed2284ab2ce2fdde5143e5d3cd618aefaf" }

[patch."https://github.com/AdaWorldAPI/lance-graph"]
# `deepnsm` (and thinking-engine, and others) carry
# `ndarray = { path = "../../../ndarray" }`; unreachable under git resolution.
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", rev = "52dc61ed2284ab2ce2fdde5143e5d3cd618aefaf" }

[profile.release]
strip = true
